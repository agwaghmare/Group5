[project]
name = "finpilot-pnc-backend"
version = "1.0.0"
description = "PNC-only FinPilot backend: finance engine, customer + staff APIs, TigerData with RLS"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<0.116",
  "uvicorn>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "SQLAlchemy>=2.0.36,<2.1",
  "alembic>=1.14",
  "psycopg[binary]>=3.2",
  "pandas>=2.2",
  "numpy>=2.0",
  "pandera>=0.20",
  "scikit-learn>=1.5",
  "lightgbm>=4.5",
  "mlflow-skinny>=3.0",
  "joblib>=1.4",
  "PyJWT>=2.9",
  "typer>=0.12",
  "httpx>=0.27",
  "python-multipart>=0.0.9",
  "solders>=0.21",
]

[project.optional-dependencies]
queue = ["celery>=5.4", "redis>=5"]
dev = ["pytest>=8", "hypothesis>=6", "ruff>=0.6"]

[project.scripts]
pnc = "app.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 140
target-version = "py312"
extend-exclude = [
  "migrations/versions",
  # legacy Learn API (pre-existing, intentionally untouched by the PNC build)
  "app/content", "app/routers", "app/services", "app/examples.py", "app/finance_math.py", "app/schemas.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008", "B905", "UP017", "UP035", "E701", "E702", "E741"]

[tool.ruff.lint.per-file-ignores]
"app/pnc/data/generator.py" = ["B023"]   # closures are invoked inside the loop iteration that defines them
