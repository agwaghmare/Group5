name: backend-ci

on:
  push:
    paths: ["backend/**", ".github/workflows/backend-ci.yml"]
  pull_request:
    paths: ["backend/**", ".github/workflows/backend-ci.yml"]

defaults:
  run:
    working-directory: backend

jobs:
  lint-and-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: ruff check app tests scripts
      # Tests marked `db` are skipped automatically when no database is reachable.
      - run: python -m pytest -q
        env:
          PYTHONPATH: .
          APP_ENV: test

  database-tests:
    # Runs the RLS / authorization / pipeline tests against the real TigerData service.
    # Needs the repository secret DATABASE_URL (owner credential of a DISPOSABLE or demo service). Not run for forks.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    needs: lint-and-unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Check secret is configured
        id: gate
        run: |
          if [ -z "$DATABASE_URL" ]; then echo "run=false" >> "$GITHUB_OUTPUT"; echo "DATABASE_URL secret not set; skipping database tests"; else echo "run=true" >> "$GITHUB_OUTPUT"; fi
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - name: Migrations apply (head)
        if: steps.gate.outputs.run == 'true'
        run: python -m alembic upgrade head
        env:
          PYTHONPATH: .
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - name: Database-backed tests
        if: steps.gate.outputs.run == 'true'
        run: python -m pytest -q -m db
        env:
          PYTHONPATH: .
          APP_ENV: test
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
